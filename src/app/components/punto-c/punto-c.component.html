<div class="container-fluid bg-secondary col-md-6 pb-2 mb-3 mt-3">
  <form>
    <h1 class="text-white text-center fw-bold mb-4" style="text-shadow: 2px 2px 8px rgba(0,0,0,0.4);">
      Conversor de Divisas
    </h1>
    <div class="mb-3">
      <label for="cantidad" class="form-label">Cantidad</label>
      <input type="number" class="form-control" id="cantidad" name="cantidad" [(ngModel)]="cantidad">
    </div>
    <div class="mb-3">
      <label>De</label>
      <select class="form-select" name="monedaOrigen" [(ngModel)]="monedaOrigen">
        <option *ngFor=" let moneda of monedas" [value]="moneda.code">{{moneda.name}} </option>
      </select>
    </div>
    <div class="mb-3">
      <label>A</label>
      <select class="form-select" name="monedaDestino" [(ngModel)]="monedaDestino">
        <option *ngFor=" let moneda of monedas" [value]="moneda.code">{{moneda.name}}</option>
      </select>
    </div>
    <button type="submit" class="btn btn-dark px-4 py-2 rounded-pill shadow-sm w-100 mt-3" (click)="convertir()">
      Convertir
    </button>
    <div class="mt-4 p-3 bg-light rounded-3 shadow-sm text-center">
      <small class="text-muted d-block mb-1">Resultado</small>
      <span class="fs-2 fw-bold text-dark">{{resultado | number}}</span>
    </div>

  </form>

</div>
